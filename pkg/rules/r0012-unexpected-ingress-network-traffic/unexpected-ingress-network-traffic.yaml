apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: unexpected-ingress-network-traffic-rule
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "Unexpected Ingress Network Traffic"
      enabled: false
      id: "R0012"
      description: "Detecting unexpected ingress network traffic that is not allowlisted by the container profile. Symmetric twin of R0011: a connection from a peer that was not observed during learning alerts, with no private-IP exemption, so lateral movement into this workload from an unlisted internal peer is detected. Matching is port- and protocol-aware on the local listening port; an entry with no ports allows any port. Peers are allowlisted narrowly via podSelector/namespaceSelector or resolved serviceRef/serviceSelector entries."
      expressions:
        message: "'Unexpected ingress network communication from: ' + event.dstAddr + ':' + string(event.dstPort) + ' using ' + event.proto + ' to: ' + event.containerName"
        uniqueId: "event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto"
        ruleExpression:
          - eventType: "network"
            expression: "event.pktType == 'HOST' && !cp.was_address_port_protocol_in_ingress(event.containerId, event.dstAddr, event.dstPort, event.proto) && !cp.was_selector_in_ingress(event.containerId, event.dstNamespace, event.dstPodLabels, event.dstPort, event.proto)"
      profileDependency: 0
      profileDataRequired:
        ingressAddresses: all
      severity: 5 # Medium
      supportPolicy: false
      isTriggerAlert: false
      mitreTactic: "TA0008"
      mitreTechnique: "T1210"
      tags:
        - "context:kubernetes"
        - "context:container"
        - "whitelisted"
        - "network"
        - "anomaly"
        - "networkprofile"
