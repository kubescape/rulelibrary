apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: unexpected-egress-network-traffic-rule
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "Unexpected Egress Network Traffic"
      enabled: false
      id: "R0011"
      description: "Detecting unexpected egress network traffic that is not allowlisted by the container profile. Internal and external peers are treated alike (no private-IP exemption): lateral movement to an unlisted internal peer alerts. Matching is port- and protocol-aware — an allowed address on a port it was not allowlisted for alerts; an entry with no ports allows any port. Internal peers are allowlisted narrowly via podSelector/namespaceSelector or resolved serviceRef/serviceSelector entries rather than a serviceCIDR that blinds detection to lateral movement."
      expressions:
        message: "'Unexpected egress network communication to: ' + event.dstAddr + ':' + string(event.dstPort) + ' using ' + event.proto + ' from: ' + event.containerName"
        uniqueId: "event.dstAddr + '_' + string(event.dstPort) + '_' + event.proto"
        ruleExpression:
          - eventType: "network"
            expression: "event.pktType == 'OUTGOING' && !cp.was_address_port_protocol_in_egress(event.containerId, event.dstAddr, event.dstPort, event.proto) && !cp.was_selector_in_egress(event.containerId, event.dstNamespace, event.dstPodLabels, event.dstPort, event.proto)"
      profileDependency: 0
      profileDataRequired:
        egressAddresses: all
      severity: 8 # High
      supportPolicy: false
      isTriggerAlert: false
      mitreTactic: "TA0010"
      mitreTechnique: "T1041"
      tags:
        - "context:kubernetes"
        - "context:container"
        - "whitelisted"
        - "network"
        - "anomaly"
        - "networkprofile"
