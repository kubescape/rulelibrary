apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: high-privileges-role-rule
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "High privileges role created"
      enabled: true
      id: "R2006"
      description: "Detects a ClusterRole or Role that grants wildcard verbs, escalate/bind/impersonate, write access to RBAC objects, pod exec, token or secret resources, or secret enumeration, created or widened via the Kubernetes admission webhook"
      expressions:
        message: >-
          'High privileges ' + event.Kind + ' ' +
          (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name +
          (event.Operation == "CREATE" ? ' created' : ' updated') +
          ' by ' + event.UserInfo.Username + ' granting ' +
          ["*", "escalate", "bind", "impersonate", "create", "update", "patch", "list", "watch"]
            .filter(v, object.rules.exists(r, has(r.verbs) && v in r.verbs)).join('/') +
          ' on ' +
          ["*", "clusterroles", "clusterrolebindings", "roles", "rolebindings",
           "pods/exec", "pods/attach", "serviceaccounts/token", "nodes/proxy", "secrets",
           "*/exec", "*/attach", "*/token", "*/proxy"]
            .filter(res, object.rules.exists(r, has(r.resources) && res in r.resources)).join(',')
        uniqueId: >-
          event.Kind + '/' + (event.Namespace != '' ? event.Namespace + '/' : '') + event.Name
        ruleExpression:
          - eventType: "k8s-admission"
            expression: >-
              [event.Kind == "ClusterRole", event.Kind == "Role"].exists(k, k) &&
              event.Operation in ["CREATE", "UPDATE"] &&
              event.UserInfo.Username != "system:serviceaccount:kube-system:clusterrole-aggregation-controller" &&
              has(object.rules) &&
              (event.Operation == "CREATE"
                ? true
                : object.rules != (has(oldObject.rules) ? oldObject.rules : [])) &&
              object.rules.exists(r,
                has(r.verbs) && has(r.resources) && has(r.apiGroups) && [
                  r.verbs.exists(v, v in ["*", "escalate", "bind", "impersonate"]),
                  (r.apiGroups.exists(g, g in ["", "*"]) &&
                    r.verbs.exists(v, v in ["create", "update", "patch"]) &&
                    r.resources.exists(res, res in ["*", "pods/exec", "pods/attach", "serviceaccounts/token", "nodes/proxy", "secrets",
                                                    "*/exec", "*/attach", "*/token", "*/proxy"])),
                  (r.apiGroups.exists(g, g in ["rbac.authorization.k8s.io", "*"]) &&
                    r.verbs.exists(v, v in ["create", "update", "patch"]) &&
                    r.resources.exists(res, res in ["*", "clusterroles", "clusterrolebindings", "roles", "rolebindings"])),
                  (r.apiGroups.exists(g, g in ["", "*"]) &&
                    r.verbs.exists(v, v in ["list", "watch"]) &&
                    r.resources.exists(res, res in ["*", "secrets"]))
                ].exists(b, b))
      profileDependency: 2
      severity: 8
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0004"
      mitreTechnique: "T1098.006"
      tags:
        - "context:kubernetes"
        - "admission"
        - "rbac"
        - "privilege-escalation"
