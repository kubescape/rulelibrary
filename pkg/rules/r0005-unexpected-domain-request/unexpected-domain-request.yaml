apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: unexpected-domain-request-rule
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "DNS Anomalies in container"
      enabled: true
      id: "R0005"
      description: "Detecting unexpected domain requests that are not learned from answered DNS responses during the completed container profile learning window."
      expressions:
        message: "'Unexpected domain communication: ' + event.name + ' from: ' + event.containerName"
        uniqueId: "event.comm + '_' + event.name"
        ruleExpression:
          - eventType: "dns"
            expression: "event.qr == 'R' && event.numAnswers > 0 && has(event.rcode) && event.rcode == 'Success' && !cp.was_dns_resolved(event.containerId, event.name)"
      profileDependency: 0
      severity: 1
      supportPolicy: false
      isTriggerAlert: false
      mitreTactic: "TA0011"
      mitreTechnique: "T1071.004"
      tags:
        - "context:kubernetes"
        - "context:container"
        - "dns"
        - "anomaly"
        - "networkprofile"
