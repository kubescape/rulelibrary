apiVersion: kubescape.io/v1
kind: Rules
metadata:
  name: privileged-pod-created-rule
  namespace: kubescape
  labels:
    app: kubescape
spec:
  rules:
    - name: "Privileged pod created"
      enabled: true
      id: "R2003"
      description: "Detects pod creation where a container runs privileged or adds a host-breaking Linux capability, via the Kubernetes admission webhook"
      expressions:
        message: >-
          'Privileged pod created: ' + event.Namespace + '/' +
          (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')) +
          ' by ' + event.UserInfo.Username
        uniqueId: >-
          event.Namespace + '/' +
          (has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() > 0
            ? string(object.metadata.ownerReferences[0].kind) + '/' + string(object.metadata.ownerReferences[0].name)
            : (event.Name != '' ? event.Name : (has(object.metadata.generateName) ? string(object.metadata.generateName) : 'unnamed')))
        ruleExpression:
          - eventType: "k8s-admission"
            expression: >-
              event.Kind == "Pod" &&
              event.Operation == "CREATE" &&
              !(event.Namespace in ["kube-system", "kube-public", "kube-node-lease", "kubescape"]) &&
              has(object.spec) && has(object.spec.containers) &&
              (object.spec.containers
                + (has(object.spec.initContainers) ? object.spec.initContainers : [])
                + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
              ).exists(c,
                has(c.securityContext) &&
                [
                  has(c.securityContext.privileged) && c.securityContext.privileged == true,
                  has(c.securityContext.capabilities) && has(c.securityContext.capabilities.add) &&
                    c.securityContext.capabilities.add.exists(cap,
                      cap in ["ALL", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_RAWIO", "SYS_BOOT",
                              "NET_ADMIN", "DAC_READ_SEARCH", "BPF", "PERFMON", "SYS_TIME"])
                ].exists(b, b)
              )
      profileDependency: 2
      severity: 8
      supportPolicy: false
      isTriggerAlert: true
      mitreTactic: "TA0004"
      mitreTechnique: "T1611"
      tags:
        - "context:kubernetes"
        - "admission"
        - "container-escape"
        - "privileged"
        - "capabilities"
